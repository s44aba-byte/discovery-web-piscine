<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
               <title>User Registration Form</title>
    </head>
    <body>
        <h1>User Registration Form</h1>

        <form action="#" method="POST">
            <!-- 1. Text Input (Full Name) with validation -->
            <div>
                <label for="fullname">Full Name:</label><br>
                <input type="text" id="fullname" name="fullname" required minlength="3">
            </div>

            <br>

            <!-- 2. Email Input -->
            <div>
                <label for="email">Email Address:</label><br>
                <input type="email" id="email" name="email" required>
            </div>

            <br>

            <!-- 3. Password Input -->
            <div>
                <label for="password">Password:</label><br>
                <input type="password" id="password" name="password" required minlength="6">
            </div>

            <br>

            <!-- 4. Radio Buttons Group (Experience Level) -->
            <div>
                <fieldset>
                    <legend>Experience Level:</legend>
                    <input type="radio" id="beginner" name="level" value="beginner" checked>
                    <label for="beginner">Beginner</label><br>

                    <input type="radio" id="intermediate" name="level" value="intermediate">
                    <label for="intermediate">Intermediate</label><br>

                    <input type="radio" id="advanced" name="level" value="advanced">
                    <label for="advanced">Advanced</label>
                </fieldset>
            </div>

            <br>

            <!-- 5. Select Dropdown (Preferred Track) -->
            <div>
                <label for="track">Preferred Track:</label><br>
                <select id="track" name="track">
                    <option value="web">Web Development</option>
                    <option value="cyber">Cyber Security</option>
                    <option value="ai">Artificial Intelligence</option>
                </select>
            </div>

            <br>

            <!-- 6. Textarea (Bio / Comments) -->
            <div>
                <label for="bio">Short Bio:</label><br>
                <textarea id="bio" name="bio" rows="4" cols="30" placeholder="Tell us about yourself..."></textarea>
            </div>

            <br>

            <!-- 7. Checkbox (Agreement) -->
            <div>
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">I agree to the terms and conditions</label>
            </div>

            <br>

            <!-- Submit Button -->
            <div>
                <button type="submit">Register</button>
            </div>
        </form>
    </body>
</html>
